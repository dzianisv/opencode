name: typecheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck

      - name: Feature invariants — v2 layout must survive every rebase
        run: |
          ERRORS=0
          check() {
            local desc="$1"; shift
            if "$@" &>/dev/null; then
              echo "  [OK] $desc"
            else
              echo "  [FAIL] $desc"
              ERRORS=$((ERRORS + 1))
            fi
          }

          # v2 design: recent sessions are built into sidebar-project.tsx natively
          # sidebar-recent.tsx was a v1 artifact — it no longer exists
          check "sidebar-project.tsx has recentSessions (v2 recent sessions)" \
            grep -q "recentSessions" packages/app/src/pages/layout/sidebar-project.tsx

          check "layout.tsx imports SortableProject (v2 layout intact)" \
            grep -q "SortableProject" packages/app/src/pages/layout.tsx

          check "sidebar-shell.tsx has SidebarContent (nav rail intact)" \
            grep -q "SidebarContent" packages/app/src/pages/layout/sidebar-shell.tsx

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "FAIL: $ERRORS v2 layout invariant(s) missing."
            echo "The v2 layout was likely broken during a rebase."
            exit 1
          fi
          echo "All v2 layout invariants present."
