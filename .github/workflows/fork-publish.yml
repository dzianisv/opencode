name: fork publish

on:
  push:
    branches:
      - dev
    paths:
      - packages/opencode/package.json
  workflow_dispatch:

concurrency:
  group: fork-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    if: github.repository == 'dzianisv/opencode'
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./packages/opencode/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Check npm registry
        id: registry
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          check() {
            if npm view "${1}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "${1}@${PACKAGE_VERSION} already published." >&2
              echo "true"
            else
              echo "${1}@${PACKAGE_VERSION} not on npm." >&2
              echo "false"
            fi
          }
          VT=$(check "@vibetechnologies/opencode")
          DZ=$(check "@dzianisv/opencode")
          echo "vt_published=${VT}" >> "$GITHUB_OUTPUT"
          echo "dz_published=${DZ}" >> "$GITHUB_OUTPUT"
          # build needed if either is unpublished
          if [[ "$VT" == "true" && "$DZ" == "true" ]]; then
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.registry.outputs.build_needed == 'true'
        uses: ./.github/actions/setup-bun

      - name: Build Linux CLI binary
        if: steps.registry.outputs.build_needed == 'true'
        working-directory: packages/opencode
        env:
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ steps.package.outputs.version }}
        run: bun run build --single

      - name: Publish @vibetechnologies/opencode
        if: steps.registry.outputs.vt_published != 'true'
        working-directory: packages/opencode
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .publish-vt
          mkdir -p .publish-vt/bin
          cp dist/opencode-linux-x64/bin/opencode .publish-vt/bin/opencode
          chmod 755 .publish-vt/bin/opencode
          cp README.md .publish-vt/README.md
          cp ../../LICENSE .publish-vt/LICENSE
          node -e "
            const fs = require('fs')
            const src = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            fs.writeFileSync('.publish-vt/package.json', JSON.stringify({
              name: '@vibetechnologies/opencode',
              version: process.env.PACKAGE_VERSION,
              description: src.description ?? 'AI-powered development tool',
              license: src.license ?? 'MIT',
              type: 'module',
              bin: { opencode: './bin/opencode' },
              os: ['linux'], cpu: ['x64'],
              files: ['bin', 'README.md', 'LICENSE'],
              repository: { type: 'git', url: 'git+https://github.com/dzianisv/opencode.git' },
              homepage: 'https://github.com/dzianisv/opencode#readme',
              bugs: { url: 'https://github.com/dzianisv/opencode/issues' },
            }, null, 2) + '\n')
          "
          npm publish .publish-vt --provenance --access public

      - name: Publish @dzianisv/opencode
        if: steps.registry.outputs.dz_published != 'true'
        working-directory: packages/opencode
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .publish-dz
          mkdir -p .publish-dz/bin
          cp dist/opencode-linux-x64/bin/opencode .publish-dz/bin/opencode
          chmod 755 .publish-dz/bin/opencode
          cp README.md .publish-dz/README.md
          cp ../../LICENSE .publish-dz/LICENSE
          node -e "
            const fs = require('fs')
            const src = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            fs.writeFileSync('.publish-dz/package.json', JSON.stringify({
              name: '@dzianisv/opencode',
              version: process.env.PACKAGE_VERSION,
              description: src.description ?? 'AI-powered development tool',
              license: src.license ?? 'MIT',
              type: 'module',
              bin: { opencode: './bin/opencode' },
              os: ['linux'], cpu: ['x64'],
              files: ['bin', 'README.md', 'LICENSE'],
              repository: { type: 'git', url: 'git+https://github.com/dzianisv/opencode.git' },
              homepage: 'https://github.com/dzianisv/opencode#readme',
              bugs: { url: 'https://github.com/dzianisv/opencode/issues' },
            }, null, 2) + '\n')
          "
          npm publish .publish-dz --provenance --access public

      - name: Create git tag
        if: always()
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${PACKAGE_VERSION}"
          git fetch --tags origin
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists."
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"
